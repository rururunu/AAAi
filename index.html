<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAAi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f5f1;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% -10%, #ffffff 0%, transparent 55%),
          linear-gradient(180deg, #f7f5f1 0%, #efeae2 52%, #e8e2d8 100%);
        color: #1c1915;
        font-family: "Noto Sans SC", "Segoe UI", sans-serif;
        user-select: none;
      }

      #boot-splash[hidden] {
        display: none !important;
      }

      #boot-splash .boot-logo-wrap {
        position: relative;
        width: 112px;
        height: 112px;
        display: grid;
        place-items: center;
      }

      #boot-splash .boot-logo {
        position: relative;
        z-index: 1;
        width: 88px;
        height: 88px;
        object-fit: contain;
        animation: boot-breathe 2.2s ease-in-out infinite;
      }

      #boot-splash .boot-halo {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(28, 25, 21, 0.1);
        border-radius: 50%;
        animation: boot-halo 2.2s ease-in-out infinite;
      }

      #boot-splash .boot-label {
        margin: 0;
        color: rgba(28, 25, 21, 0.62);
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      #boot-splash .boot-progress {
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(28, 25, 21, 0.08);
      }

      #boot-splash .boot-progress > i {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: inherit;
        background: #171411;
        animation: boot-progress 1.45s ease-in-out infinite;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.04);
          opacity: 1;
        }
      }

      @keyframes boot-halo {
        0%,
        100% {
          transform: scale(0.92);
          opacity: 0.55;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
          opacity: 0.45;
        }
        45% {
          opacity: 1;
        }
        100% {
          transform: translateX(320%);
          opacity: 0.45;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-logo,
        #boot-splash .boot-halo,
        #boot-splash .boot-progress > i {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-live="polite" aria-busy="true">
      <div class="boot-logo-wrap" aria-hidden="true">
        <img class="boot-logo" src="/aaai-logo.svg" alt="" />
        <span class="boot-halo"></span>
      </div>
      <p class="boot-label">请稍等，正在为您准备……</p>
      <span class="boot-progress" aria-hidden="true"><i></i></span>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
