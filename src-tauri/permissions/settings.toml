[[permission]]
identifier = "allow-settings-commands"
description = "Enables settings read/write commands."
commands.allow = [
  "get_app_settings",
  "set_app_settings",
  "list_vscode_themes",
  "load_vscode_theme",
  "list_skills",
  "install_skill",
  "uninstall_skill",
  "get_skills_dir",
  "open_skills_dir",
  "get_mcp_runtime_support",
  "gemini_auth_status",
  "gemini_oauth_login",
  "gemini_oauth_logout",
  "gemini_import_client_secrets",
]
